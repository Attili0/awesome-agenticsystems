name: Fix a classification
description: A paper is filed under the wrong area, or is missing topics/facets
title: "[Fix]: "
labels: ["classification"]
body:
  - type: markdown
    attributes:
      value: |
        A disagreement about a classification is recorded as signal on the taxonomy. The area of a paper is a judgment call, and the criteria are written down so that the call can be argued with.

  - type: input
    id: paper
    attributes:
      label: Which paper
      description: The id (the filename without `.yml`) or the link to its page.
      placeholder: react-2022
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: >-
        What the record says now, and what it should say. For a change of
        area, name the contribution taken as the main one.
      placeholder: |
        It is filed under `coordination`, but the contribution is the shared
        memory mechanism; the multi-agent part is the setting of the
        experiment. It should be `memory` with scale: [multi-agent].
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Where in the paper does this show
      description: >-
        Optional. A section number or a quoted claim is enough to settle the
        point.
    validations:
      required: false
