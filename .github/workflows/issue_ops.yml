name: Process Paper Submission

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  process-paper:
    if: contains(github.event.issue.labels.*.name, 'paper')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bibtexparser
          
      - name: Save Issue Body
        env:
          BODY: ${{ github.event.issue.body }}
        run: echo "$BODY" > issue_body.md
        
      - name: Process Issue
        run: python scripts/process_issue.py issue_body.md
        
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add new paper from issue #${{ github.event.issue.number }}"
          title: "Add paper: ${{ github.event.issue.title }}"
          body: "Closes #${{ github.event.issue.number }}\n\nAuto-generated from issue submission."
          branch: "add-paper-${{ github.event.issue.number }}"
          labels: "paper"
