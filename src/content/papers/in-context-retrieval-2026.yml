tldr: "Studies in-context retrieval at million-token corpus scale and traces its collapse to attention dilution, where irrelevant documents dominate the softmax denominator."
notes: "As the corpus grows, normalized attention mass on the gold document falls even when its pre-softmax score holds. The result applies to designs that use a long context window as a substitute for retrieval."
