tldr: "Recovers the latent tasks inside an unconstrained computer-use trace and induces, for each, a hierarchical objective model paired with a procedure model of the control flow."
notes: "Treats passively recorded human work as the training signal, and constrains the output to be symbolic and auditable. The disentangling of interleaved concurrent tasks is the problem it claims to solve."
