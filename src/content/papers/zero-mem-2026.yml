tldr: "Runs memory operations with no LLM calls at all \u2014 an entity-context graph plus a temporal hierarchy over the original traces \u2014 reserving generation for the final answer."
notes: "Worth reading against the assumption that agent memory needs an LLM to write and mediate it. Keeping the raw traces as the record also sidesteps the usual failure where summarisation drops the evidence the answer needed."
