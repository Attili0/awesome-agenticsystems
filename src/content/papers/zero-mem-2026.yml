tldr: "Runs memory operations with no LLM calls, using an entity-context graph and a temporal hierarchy over the original traces, and reserves generation for the final answer."
notes: "Shows the memory layer running without an LLM to write or mediate it. Keeping the raw traces as the record avoids the failure where summarization drops the evidence the answer needed."
