tldr: "A replication workflow implemented as a coding-agent skill, where each paper claim becomes a recorded target and completion depends on workspace evidence passing validation checks."
notes: "The completion gate is external to the agent's final message. Even so, all twelve runs pass the gate while differing in how papers are split into targets and in the rules used to accept evidence. Completion checks bound the failure; they do not make runs comparable."
