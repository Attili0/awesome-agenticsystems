tldr: "A small framework for harnessed agentic RL, where the deploy-time harness owns the environment loop and the trainer sees only request-response pairs."
notes: "Names the paradigm \u2014 harnessed agentic RL \u2014 and is explicit about what it costs: retokenization, sample merging, advantage calculation and loss normalisation all become open problems once the trainer no longer owns the loop."
