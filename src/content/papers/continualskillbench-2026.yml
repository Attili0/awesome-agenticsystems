tldr: "Five domains of 100 interconnected subtasks ordered by difficulty, built to test whether agents actually consolidate reusable skills rather than just adapting to recent context."
notes: "The control is the point: in-context learning performs comparably to explicit skill maintenance on average, which suggests much of the apparent skill evolution is just adaptation to prior context. Weaker models accumulate larger and more fragmented skill collections."
