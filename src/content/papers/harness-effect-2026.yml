tldr: "Holds six models constant and swaps only the orchestration layer, cutting cost per task 41% and tokens per task 38% at parity quality."
notes: "On this workload the orchestration layer moved cost more than the spread across the six models did. The reported correlation between a model's gain and its baseline strength (r=0.99, n=6) rests on six points."
