tldr: "Convierte el feedback de un intento fallido en texto y lo guarda en memoria episódica para condicionar el reintento, sin actualizar pesos."
notes: "Caso claro donde la unidad de evaluación no es el intento sino la secuencia de intentos. Un benchmark que mide solo pass@1 no captura lo que este método aporta. Ojo con la frontera: esto es self-correction dentro de un episodio, no self-evolution — el aprendizaje se descarta al terminar la tarea."
