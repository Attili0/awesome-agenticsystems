tldr: "Turns the feedback from a failed attempt into text and stores it in episodic memory to condition the retry, without updating weights."
notes: "A clear case where the unit of evaluation is not the attempt but the sequence of attempts. A benchmark measuring only pass@1 does not capture what this method contributes. Mind the boundary: this is self-correction within an episode, not self-evolution — the learning is discarded when the task ends."
