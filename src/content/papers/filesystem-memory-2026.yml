tldr: "Studies the de facto default for agent memory \u2014 a directory of markdown files the agent maintains itself \u2014 across memory shape, stream scale and tool harness."
notes: "Two results worth arguing with. Organisation buys search economy, roughly halving retrieval cost, but no measured agent converts organisation into better answers. And changing only the tool set reshapes the store as strongly as changing the model, which makes the harness a variable in memory research rather than a constant."
