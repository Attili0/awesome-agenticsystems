tldr: "Studies the de facto default for agent memory, a directory of markdown files the agent maintains itself, across memory shape, stream scale and tool harness."
notes: "Organization roughly halves retrieval cost, and no measured agent converts organization into higher answer accuracy. Changing only the tool set reshapes the store as much as changing the model. The harness is therefore a variable in memory research."
