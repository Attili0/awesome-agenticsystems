tldr: "A training-free inference method that builds a query-conditioned evidence pool from the model's own relevance signals and replays it before generation, without pruning the original context."
notes: "Frames the context window itself as an associative memory store, with replay as trace reactivation. That framing is why this is filed under tools-context: the contribution is how context is organized for one call."
